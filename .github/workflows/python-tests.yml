name: RoverSetter Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run model unit tests
        run: python -m unittest discover -s analysis/tests -v
      - name: Reproduce hypothetical numerical scenarios
        run: python analysis/src/roversetter_stability.py
